benchmark_id: benchmark_v2
experiment_name: earthquake-forecasting
tracking_db_path: mlflow.db

champion:
  tag: v0.2.0-prod-stable
  model_family: lightgbm
  feature_set_version: candidate_feature_set_v1
  split_version: split_temporal_v1

dataset:
  path: data/features_clean/dataset_v5_dedup.csv
  version: dataset_v5_dedup
  time_column: datetime
  target_columns:
    - label_7d
    - label_30d

split:
  type: temporal
  train_end: "2018-12-31"
  validation_end: "2021-12-31"
  test_end: "2026-12-31"

metrics:
  primary_by_horizon:
    label_7d: pr_auc
    label_30d: pr_auc
  secondary:
    - roc_auc
    - brier_score

baseline:
  type: class_frequency

seed: 42
