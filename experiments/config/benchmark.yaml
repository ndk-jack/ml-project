benchmark_id: benchmark_v1
experiment_name: earthquake-forecasting
tracking_uri: sqlite:////Users/nazlidecker/ml-project/mlflow.db

champion:
  tag: v0.2.0-prod-stable
  model_family: lightgbm
  feature_set_version: feature_set_v3_prod
  split_version: split_temporal_v1

dataset:
  path: /Users/nazlidecker/ml-project/data/features/dataset_v3.csv
  version: dataset_v3
  time_column: datetime
  target_columns:
    - label_7d
    - label_30d
    - label_365d

split:
  type: temporal
  train_end: "2018-12-31"
  validation_end: "2021-12-31"
  test_end: "2026-12-31"

metrics:
  primary_by_horizon:
    label_7d: pr_auc
    label_30d: pr_auc
    label_365d: brier_score
  secondary:
    - roc_auc
    - brier_score

baseline:
  type: class_frequency

seed: 42