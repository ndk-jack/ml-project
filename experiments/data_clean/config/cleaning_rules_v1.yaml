dataset_source: data/features/dataset_v3.csv
dataset_output: data/features_clean/dataset_v4_clean.csv
time_column: datetime
target_columns:
  - label_7d
  - label_30d

drop_columns_exact:
  - label_365d

drop_if_constant: true
drop_if_all_null: true
drop_non_numeric_features_except:
  - datetime

notes:
  - Build a cleaner benchmark dataset without touching production artifacts.
  - Keep only targets used in benchmark_v1.
  - Preserve comparability with dataset_v3.
